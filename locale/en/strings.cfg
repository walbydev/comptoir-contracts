; locale/en/strings.cfg — English strings.
;
; Description: every text the player reads, in English. Keys arrive with the prototype or the window
;              that uses them, never before: an unused key is a translation that rots.
; Author:      Philippe Ryf
; Created:     2026-10-25
; Revisions:   2026-10-25 — initial: the counter, its recipe and the technology
;              2026-10-25 — b4: `no_free_slot`, the refusal of a fourth live contract (ADR 0051)
;              2026-10-25 — lot b regression: the `[comptoir]` keys carried their own prefix, so the
;                           engine registered `comptoir.comptoir-available` while the window asked for
;                           `comptoir-available` — every GUI string rendered "Unknown key". The keys
;                           are now the canonical Factorio form (ADR 0053): section `[comptoir]`, key
;                           without the prefix, referenced as `{"comptoir.<key>"}`, and `_` in a
;                           reason name became `-` so every key matches `[a-z0-9-]+`
; Usages:      loaded by the game; `en` is the fallback language
; Notes:       A21 requires this file and `fr/strings.cfg` to hold the same key set. "Comptoir" stays
;              "Comptoir" in both: it is the family name of the mod, not a translated noun.
;              THE ONE FORM THAT WORKS: `[comptoir]` + `available=…` + `{"comptoir.available"}`. A key
;              written as `comptoir-available` inside `[comptoir]` resolves nowhere, and a key with a
;              dot or an underscore in its name is not a key at all. `tools/check_locale.py` refuses
;              the three shapes before the game is started (`make check`).
; Licence:     MIT (see LICENSE)

