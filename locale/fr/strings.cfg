; locale/fr/strings.cfg — chaînes françaises.
; (This file is French because its content is French. Its header, like every other header in this
; repository, is in English.)
;
; Description: the same keys as `en/strings.cfg`, in French. A key missing here falls back to
;              English silently, which is why A21 compares the two key sets instead of trusting them.
; Author:      Philippe Ryf
; Created:     2026-10-25
; Revisions:   2026-10-25 — initial: le comptoir, sa recette et la technologie
;              2026-10-25 — lot b regression: the `[comptoir]` keys carried their own prefix, so the
;                           French client showed "Unknown key" like the English one. Canonical
;                           Factorio form now (ADR 0053): prefix in the section name only, `_`
;                           replaced by `-` in the reason names
; Usages:      loaded by the game when the client language is French
; Licence:     MIT (see LICENSE)

